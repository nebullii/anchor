name: Deploy — Production

# push to main → full CI (same jobs as PRs, incl. the end-to-end suite)
#   → approval (GitHub Environment "production": add required reviewers)
#   → build → migrate → new revision with no traffic → smoke test
#   → traffic shift → verify → automatic rollback on any failure.
#
# One-time setup (see SETUP_GCLOUD.md):
#   - Secret Manager secrets with prefix anchor-prod-*
#   - repo variables GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_DEPLOY_SERVICE_ACCOUNT
#     (or the legacy GCP_SA_KEY secret)
#   - Settings → Environments → production → Required reviewers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # never cancel a prod deploy mid-flight

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Production
    needs: ci
    # Opt-in: deploying to GCP can cost money, so nothing is deployed until the
    # repository variable ANCHOR_DEPLOY_ENABLED is set to "true". Until then a
    # merge only runs CI (free for public repositories).
    if: vars.ANCHOR_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: production
      service: anchor-prod
      worker: anchor-worker
      migrate_job: anchor-migrate
      secret_prefix: anchor-prod
      web_max_instances: 3
