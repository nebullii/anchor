name: Deploy — Staging

# push to staging → full CI → deploy to the "staging" GitHub Environment with
# the same safe rollout as production (no-traffic revision, smoke test,
# traffic shift, automatic rollback). Promote to production by merging
# staging into main.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Staging
    needs: ci
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: staging
      service: anchor-staging
      worker: anchor-worker-staging
      migrate_job: anchor-migrate-staging
      secret_prefix: anchor-staging
      web_max_instances: 1
