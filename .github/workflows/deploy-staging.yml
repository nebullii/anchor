name: Deploy — Staging

# push to staging → full CI → deploy to the "staging" GitHub Environment with
# the same safe rollout as production (no-traffic revision, smoke test,
# traffic shift, automatic rollback). Promote to production by merging
# staging into main.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Staging
    needs: ci
    # Opt-in: deploying to GCP can cost money, so nothing is deployed until the
    # repository variable ANCHOR_DEPLOY_ENABLED is set to "true". Until then a
    # merge only runs CI (free for public repositories).
    if: vars.ANCHOR_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: staging
      service: anchor-staging
      worker: anchor-worker-staging
      migrate_job: anchor-migrate-staging
      secret_prefix: anchor-staging
      web_max_instances: 1
