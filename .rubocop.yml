# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Offenses that pre-date CI enforcement, listed per file so `rubocop` passes
# today and new code is held to the full style. Shrink it by running
# `bundle exec rubocop -a <file>` when you touch a listed file, then
# regenerate with:
#   bundle exec rubocop --auto-gen-config --no-auto-gen-timestamp --exclude-limit 200
inherit_from: .rubocop_todo.yml

AllCops:
  Exclude:
    # Generated by Rails — rewritten on every migration, never hand-edited.
    - "db/schema.rb"
    - "db/*_schema.rb"
    - "bin/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - "node_modules/**/*"
