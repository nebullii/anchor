id: secret_printed_in_logs
description: >
  A debug line prints the Stripe key and the database URL before the app fails on a bad
  Stripe API version. Both secret values must be redacted before the prompt is sent.
framework: express
error_message: "Container failed to start: StripeInvalidRequestError: Invalid Stripe API version: 2099-01-01"
secrets:
  - stripe-key-FAKE-for-redaction-test
  - s3cr3t-db-pa55word
logs: |
  [debug] config: stripeKey=stripe-key-FAKE-for-redaction-test db=postgres://shop:s3cr3t-db-pa55word@10.0.0.4:5432/shop
  StripeInvalidRequestError: Invalid Stripe API version: 2099-01-01
      at res.toJSON.then.StripeAPIError.message (/app/node_modules/stripe/cjs/RequestSender.js:102:31)
  Container called exit(1).
expect:
  category: [runtime_crash, missing_env_var, unknown]
  mentions_any: [apiVersion, API version, "2099-01-01"]
reference:
  summary: The app crashed because it configures Stripe with an invalid API version (2099-01-01).
  likely_cause: The Stripe client is created with apiVersion '2099-01-01', which Stripe rejects. The logs also print secret values; remove that debug line.
  fix_steps:
    - Set apiVersion to a valid Stripe API version or remove it to use the account default
    - Remove the debug log line that prints the Stripe key and database URL, and rotate both credentials
  confidence: high
  category: runtime_crash
